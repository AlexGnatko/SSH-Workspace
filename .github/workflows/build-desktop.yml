name: Build desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: msi
            artifact: windows-x64
            pattern: '*.msi'
          - runner: ubuntu-24.04
            target: linux
            artifact: linux-x64
            pattern: '*.AppImage'
          - runner: macos-15-intel
            target: mac
            artifact: macos-x64
            pattern: '*.dmg'
          - runner: macos-15
            target: mac
            artifact: macos-arm64
            pattern: '*.dmg'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: release/*/${{ matrix.pattern }}
          if-no-files-found: error
